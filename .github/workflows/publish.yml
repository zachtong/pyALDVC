name: Publish to PyPI

# Publishes when a version tag is pushed. Uses PyPI Trusted Publishing
# (OpenID Connect), so there is no API token to paste, store or rotate:
# PyPI verifies the workflow's short-lived identity instead.
#
# One-time setup on PyPI (Your projects -> al-dvc -> Publishing):
#   Owner            zachtong
#   Repository       pyALDVC
#   Workflow         publish.yml
#   Environment      pypi
#
# Release flow after that:
#   git tag -a v0.2.0 -m "..." && git push origin v0.2.0
#   -> this builds, checks and publishes, then attaches the artifacts
#      to the GitHub Release for that tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # manual re-run, e.g. after a failed publish

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$TAG  pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # gate releases behind an environment rule if wanted
    permissions:
      id-token: write          # required for Trusted Publishing
      contents: write          # attach the artifacts to the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A version already on PyPI is skipped rather than failing the run,
          # so a manual re-run after a partial failure is safe.
          skip-existing: true

      - name: Attach artifacts to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
